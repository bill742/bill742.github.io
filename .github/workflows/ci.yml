# Single CI/CD pipeline: lint, React Doctor, Playwright, and (on master) build
# + deploy to GitHub Pages. Checks run as parallel jobs; deploy waits on all of
# them, so a red check blocks the release.

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# New commits on a PR cancel the in-flight run; runs on master always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NEXT_PUBLIC_* values are inlined at build time, and a missing flag changes
# which sections render, so every job that builds needs the same set. The
# Formspree secret is scoped to the steps that build, so third-party actions
# (React Doctor) never see it.
env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_SITE_TITLE: ${{ vars.NEXT_PUBLIC_SITE_TITLE }}
  NEXT_PUBLIC_DISPLAY_PORTFOLIO: ${{ vars.NEXT_PUBLIC_DISPLAY_PORTFOLIO }}
  NEXT_PUBLIC_DISPLAY_BLOG: ${{ vars.NEXT_PUBLIC_DISPLAY_BLOG }}
  NEXT_PUBLIC_EMAIL_ADDRESS: ${{ vars.NEXT_PUBLIC_EMAIL_ADDRESS }}
  NEXT_PUBLIC_GH_USERNAME: ${{ vars.NEXT_PUBLIC_GH_USERNAME }}
  NEXT_PUBLIC_LINKEDIN_USERNAME: ${{ vars.NEXT_PUBLIC_LINKEDIN_USERNAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Advisory: posts a PR summary, inline comments, and a commit status but
      # never fails. Set `blocking: error` (or `warning`) to gate on findings.
      # Reference: https://www.react.doctor/ci
      - uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Browsers + system deps are pre-installed in this image. Keep the tag in
    # sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's webServer builds and serves the static export;
      # playwright.config.ts overrides NEXT_PUBLIC_SITE_URL to the local server.
      - run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_FORMSPREE_CODE: ${{ secrets.NEXT_PUBLIC_FORMSPREE_CODE }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Separate from the test build because that one points NEXT_PUBLIC_SITE_URL
  # at localhost. Runs alongside the checks, so it adds no wall-clock time.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_FORMSPREE_CODE: ${{ secrets.NEXT_PUBLIC_FORMSPREE_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; never cancel one mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
