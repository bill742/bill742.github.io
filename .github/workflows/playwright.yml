name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Browsers + system deps are pre-installed in this image, so there is no
    # flaky "playwright install" download step to hang. Keep the tag in sync
    # with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Playwright tests
        # Playwright's webServer builds the branch and serves the static
        # export, so every one of these has to be present here: they are
        # inlined at build time, and a missing flag changes which sections
        # render. NEXT_PUBLIC_SITE_URL is overridden by playwright.config.ts
        # to point at the local server.
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_SITE_TITLE: ${{ vars.NEXT_PUBLIC_SITE_TITLE }}
          NEXT_PUBLIC_DISPLAY_PORTFOLIO: ${{ vars.NEXT_PUBLIC_DISPLAY_PORTFOLIO }}
          NEXT_PUBLIC_DISPLAY_BLOG: ${{ vars.NEXT_PUBLIC_DISPLAY_BLOG }}
          NEXT_PUBLIC_EMAIL_ADDRESS: ${{ vars.NEXT_PUBLIC_EMAIL_ADDRESS }}
          NEXT_PUBLIC_GH_USERNAME: ${{ vars.NEXT_PUBLIC_GH_USERNAME }}
          NEXT_PUBLIC_LINKEDIN_USERNAME: ${{ vars.NEXT_PUBLIC_LINKEDIN_USERNAME }}
          NEXT_PUBLIC_FORMSPREE_CODE: ${{ secrets.NEXT_PUBLIC_FORMSPREE_CODE }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
